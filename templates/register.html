{% extends "base.html" %}

{% block title %}회원가입 - CANJIA{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">회원가입</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">사용자 이름</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                        <div class="form-text">로그인에 사용할 사용자 이름입니다.</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="name" class="form-label">실명</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">이메일</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">비밀번호</label>
                        <input type="password" class="form-control" id="password" name="password" required minlength="8">
                        <div class="form-text">최소 8자 이상 입력해주세요.</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">비밀번호 확인</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-person-plus"></i> 회원가입
                        </button>
                    </div>
                </form>
                
                <hr>
                
                <p class="text-center mb-0">
                    이미 계정이 있으신가요? 
                    <a href="{{ url_for('login') }}">로그인</a>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
document.querySelector('form').addEventListener('submit', function(e) {
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    
    if (password !== confirmPassword) {
        e.preventDefault();
        alert('비밀번호가 일치하지 않습니다.');
    }
});
</script>
{% endblock %}
