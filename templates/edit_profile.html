{% extends "base.html" %}

{% block title %}프로필 수정 - CANJIA{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2 class="mb-4">프로필 수정</h2>
    </div>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label">이름</label>
                        <input type="text" class="form-control" id="name" value="{{ user.name }}" disabled>
                        <div class="form-text">이름은 Microsoft 계정에서 동기화됩니다.</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">이메일</label>
                        <input type="email" class="form-control" id="email" value="{{ user.email }}" disabled>
                        <div class="form-text">이메일은 Microsoft 계정에서 동기화됩니다.</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="bio" class="form-label">소개글</label>
                        <textarea class="form-control" id="bio" name="bio" rows="5" placeholder="자신을 소개해주세요...">{{ user.bio or '' }}</textarea>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> 저장
                        </button>
                        <a href="{{ url_for('profile') }}" class="btn btn-secondary">
                            취소
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
